name: Get Hot News
run-name: Get Hot News - ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # 上午完整推送：北京时间 11:17 / 11:47 / 12:17
    # GitHub Actions 可能延迟，所以放 3 个备份点；成功一次后，后面的会自动跳过
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"

    # 下午增量推送：北京时间 15:17 / 15:47 / 16:17
    # 同样是备份点；成功一次后，后面的会自动跳过
    - cron: "17 7 * * *"
    - cron: "47 7 * * *"
    - cron: "17 8 * * *"

  workflow_dispatch:

concurrency:
  group: trendradar-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Decide run slot
        run: |
          echo "Current schedule: ${{ github.event.schedule }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_SLOT=manual" >> "$GITHUB_ENV"
            echo "REPORT_MODE=current" >> "$GITHUB_ENV"
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            "17 7 * * *"|"47 7 * * *"|"17 8 * * *")
              echo "RUN_SLOT=afternoon" >> "$GITHUB_ENV"
              echo "REPORT_MODE=incremental" >> "$GITHUB_ENV"
              ;;
            *)
              echo "RUN_SLOT=morning" >> "$GITHUB_ENV"
              echo "REPORT_MODE=current" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Check whether this slot already succeeded today
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RUN_SLOT" = "manual" ]; then
            echo "Manual run: do not skip."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          current_slot = os.environ["RUN_SLOT"]

          def title_to_slot(title: str):
              title = title or ""
              if "17 7 * * *" in title or "47 7 * * *" in title or "17 8 * * *" in title:
                  return "afternoon"
              if "17 3 * * *" in title or "47 3 * * *" in title or "17 4 * * *" in title:
                  return "morning"
              return None

          url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=50&branch=main"
          result = subprocess.run(
              [
                  "curl",
                  "-sS",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/vnd.github+json",
                  url,
              ],
              check=True,
              text=True,
              capture_output=True,
          )

          data = json.loads(result.stdout)
          runs = data.get("workflow_runs", [])

          china_today = datetime.now(timezone.utc).astimezone(
              timezone(timedelta(hours=8))
          ).date()

          should_skip = False

          for run in runs:
              if int(run.get("id", 0)) == current_run_id:
                  continue

              if run.get("event") != "schedule":
                  continue

              if run.get("status") != "completed":
                  continue

              if run.get("conclusion") != "success":
                  continue

              run_name = run.get("name", "") or ""
              display_title = run.get("display_title", "") or ""
              combined_title = f"{run_name} {display_title}"

              if "Get Hot News" not in combined_title:
                  continue

              previous_slot = title_to_slot(combined_title)
              if previous_slot != current_slot:
                  continue

              created_at = run.get("created_at")
              if not created_at:
                  continue

              created_date = datetime.fromisoformat(
                  created_at.replace("Z", "+00:00")
              ).astimezone(timezone(timedelta(hours=8))).date()

              if created_date != china_today:
                  continue

              print(f"Already succeeded today for slot: {current_slot}")
              print(f"Previous run: {run.get('html_url')}")
              should_skip = True
              break

          if should_skip:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write("SKIP_REST=true\n")
          else:
              print(f"No successful run found today for slot: {current_slot}")
          PY

      - name: Checkout my config repository
        if: env.SKIP_REST != 'true'
        uses: actions/checkout@v4
        with:
          path: my-config

      - name: Checkout TrendRadar source
        if: env.SKIP_REST != 'true'
        uses: actions/checkout@v4
        with:
          repository: SANSAN0/TRENDRADAR
          ref: master
          path: TrendRadar

      - name: Copy my config
        if: env.SKIP_REST != 'true'
        run: |
          if [ -d my-config/config ]; then
            cp -r my-config/config/* TrendRadar/config/
          fi

      - name: Apply report mode
        if: env.SKIP_REST != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import os

          mode = os.environ.get("REPORT_MODE", "current")
          config_path = Path("TrendRadar/config/config.yaml")

          if not config_path.exists():
              raise FileNotFoundError("TrendRadar/config/config.yaml not found")

          text = config_path.read_text(encoding="utf-8")

          pattern = r"(?m)^(\s*mode:\s*)(daily|current|incremental)(\s*(#.*)?)$"

          if re.search(pattern, text):
              text = re.sub(pattern, rf"\1{mode}\3", text, count=1)
          else:
              text += f"\nmode: {mode}\n"

          config_path.write_text(text, encoding="utf-8")
          print(f"TrendRadar report mode set to: {mode}")
          PY

      - name: Set up Python
        if: env.SKIP_REST != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: env.SKIP_REST != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        if: env.SKIP_REST != 'true'
        working-directory: TrendRadar
        run: uv sync --frozen --no-dev

      - name: Run TrendRadar
        if: env.SKIP_REST != 'true'
        working-directory: TrendRadar
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Generate video topic radar
        if: env.SKIP_REST != 'true'
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: python my-config/scripts/topic_picker.py --trendradar-dir TrendRadar

      - name: Skip notice
        if: env.SKIP_REST == 'true'
        run: |
          echo "This backup schedule is skipped because this slot already succeeded today."
