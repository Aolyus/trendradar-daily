name: Get Hot News
run-name: Get Hot News - ${{ github.event.schedule || 'manual' }}

on:
  schedule:
    # 上午完整推送：北京时间 11:17 / 11:47 / 12:17
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"

    # 下午新增推送：北京时间 15:17 / 15:47 / 16:17
    - cron: "17 7 * * *"
    - cron: "47 7 * * *"
    - cron: "17 8 * * *"

  workflow_dispatch:

concurrency:
  group: trendradar-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Decide run slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os

          schedule = os.environ.get("EVENT_SCHEDULE", "")
          event_name = os.environ.get("EVENT_NAME", "")

          morning_schedules = {"17 3 * * *", "47 3 * * *", "17 4 * * *"}
          afternoon_schedules = {"17 7 * * *", "47 7 * * *", "17 8 * * *"}

          if event_name != "schedule":
              slot = "manual"
              report_mode = "current"
          elif schedule in afternoon_schedules:
              slot = "afternoon"
              report_mode = "incremental"
          elif schedule in morning_schedules:
              slot = "morning"
              report_mode = "current"
          else:
              slot = "unknown"
              report_mode = "current"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"slot={slot}\n")
              f.write(f"report_mode={report_mode}\n")
              f.write(f"schedule={schedule}\n")

          print("event_name:", event_name)
          print("schedule:", schedule)
          print("slot:", slot)
          print("report_mode:", report_mode)
          PY

      - name: Check whether this slot already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          event_name = os.environ["EVENT_NAME"]
          run_id = int(os.environ["RUN_ID"])
          slot = os.environ["SLOT"]

          if event_name != "schedule":
              print("Manual run, always execute.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("should_run=true\n")
              raise SystemExit(0)

          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).date()
          start_local = dt.datetime.combine(today, dt.time.min, tzinfo=tz)
          start_utc = start_local.astimezone(dt.timezone.utc)

          morning_schedules = {"17 3 * * *", "47 3 * * *", "17 4 * * *"}
          afternoon_schedules = {"17 7 * * *", "47 7 * * *", "17 8 * * *"}

          def title_to_slot(title):
              if not title:
                  return None
              for cron in morning_schedules:
                  if cron in title:
                      return "morning"
              for cron in afternoon_schedules:
                  if cron in title:
                      return "afternoon"
              return None

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs?per_page=100"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "trendradar-daily",
              },
          )
          data = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))

          already_success = False
          for run in data.get("workflow_runs", []):
              if int(run["id"]) == run_id:
                  continue
              if run.get("name") != "Get Hot News":
                  continue
              if run.get("event") != "schedule":
                  continue
              if run.get("conclusion") != "success":
                  continue

              created = dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if created < start_utc:
                  continue

              previous_slot = title_to_slot(run.get("display_title", ""))
              if previous_slot == slot:
                  already_success = True
                  print("Found successful scheduled run in this slot today:", run["html_url"])
                  print("display_title:", run.get("display_title", ""))
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'false' if already_success else 'true'}\n")

          if already_success:
              print(f"Today's {slot} scheduled push already succeeded. Skip this backup run.")
          else:
              print(f"No successful {slot} scheduled run today. Continue.")
          PY

      - name: Checkout my config repository
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          path: my-config

      - name: Checkout TrendRadar source
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: SANSAN0/TRENDRADAR
          ref: master
          path: TrendRadar

      - name: Copy my config
        if: steps.guard.outputs.should_run == 'true'
        run: |
          if [ -d my-config/config ]; then
            cp -r my-config/config/* TrendRadar/config/
          fi

      - name: Apply report mode
        if: steps.guard.outputs.should_run == 'true'
        env:
          REPORT_MODE: ${{ steps.slot.outputs.report_mode }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("TrendRadar/config/config.yaml")
          text = path.read_text(encoding="utf-8")
          mode = os.environ["REPORT_MODE"]

          if re.search(r"(?m)^report:\s*$", text) and re.search(r"(?m)^  mode:\s*", text):
              text = re.sub(r'(?m)^  mode:\s*["\']?\w+["\']?\s*$', f'  mode: "{mode}"', text, count=1)
          else:
              text += f'\nreport:\n  mode: "{mode}"\n'

          path.write_text(text, encoding="utf-8")
          print("Applied report.mode =", mode)
          PY

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.guard.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        working-directory: TrendRadar
        run: uv sync --frozen --no-dev

      - name: Run TrendRadar
        if: steps.guard.outputs.should_run == 'true'
        working-directory: TrendRadar
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Generate video topic radar
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
        run: python my-config/scripts/topic_picker.py --trendradar-dir TrendRadar
