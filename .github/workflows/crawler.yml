name: Get Hot News
run-name: AI News - ${{ inputs.slot || github.event.schedule || 'manual' }} - ${{ inputs.source || 'github' }}

on:
  schedule:
    # Primary clock, Beijing 10:47 and 15:47 (GitHub cron uses UTC).
    - cron: "47 2 * * *"
    - cron: "47 7 * * *"

  workflow_dispatch:
    inputs:
      slot:
        description: "Delivery slot"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - morning
          - afternoon
      source:
        description: "Trigger source"
        required: true
        default: manual
        type: choice
        options:
          - manual
          - watchdog
      force:
        description: "Ignore an existing success record"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Collect only; do not send or record success"
        required: true
        default: false
        type: boolean

# The primary clock and watchdog share one queue. They can never send in parallel.
concurrency:
  group: trendradar-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout configuration and delivery state
        uses: actions/checkout@v4
        with:
          path: my-config
          fetch-depth: 0

      - name: Resolve slot and delivery gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_SLOT: ${{ inputs.slot || 'auto' }}
          TRIGGER_SOURCE: ${{ inputs.source || 'github-schedule' }}
          FORCE_RUN: ${{ inputs.force || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          python my-config/scripts/delivery_gate.py gate \
            --state my-config/state/delivery-log.json \
            --event-name "$EVENT_NAME" \
            --schedule "$EVENT_SCHEDULE" \
            --requested-slot "$REQUESTED_SLOT" \
            --source "$TRIGGER_SOURCE" \
            --force "$FORCE_RUN" \
            --dry-run "$DRY_RUN" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned TrendRadar source
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: SANSAN0/TRENDRADAR
          ref: 8ee26026ba6c11dec41a95fb3895a7162876caa1
          path: TrendRadar
          persist-credentials: false

      - name: Copy custom configuration
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          cp -r my-config/config/* TrendRadar/config/

      - name: Apply report mode
        if: steps.gate.outputs.should_run == 'true'
        env:
          REPORT_MODE: ${{ steps.gate.outputs.report_mode }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          mode = os.environ["REPORT_MODE"]
          config_path = Path("TrendRadar/config/config.yaml")
          lines = config_path.read_text(encoding="utf-8").splitlines()
          report_index = next(
              (index for index, line in enumerate(lines) if line.strip() == "report:"),
              None,
          )
          if report_index is None:
              raise RuntimeError("The report section was not found in config.yaml")

          mode_updated = False
          for index in range(report_index + 1, len(lines)):
              line = lines[index]
              if line and not line[0].isspace():
                  break
              if re.match(r"^\s+mode\s*:", line):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}mode: "{mode}"'
                  mode_updated = True
                  break
          if not mode_updated:
              raise RuntimeError("report.mode was not found in config.yaml")

          config_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"TrendRadar report.mode set to: {mode}")
          PY

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        working-directory: TrendRadar
        run: uv sync --frozen --no-dev

      - name: Run TrendRadar with strict Feishu status
        if: steps.gate.outputs.should_run == 'true'
        working-directory: TrendRadar
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_ACTIONS: true
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          uv run python ../my-config/scripts/run_trendradar_strict.py "${args[@]}"

      # Morning produces the full topic radar. Afternoon only sends 1-3 strong
      # incremental ideas and stays silent when no worthwhile update exists.
      - name: Generate video topic radar
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          ZHIPU_SEARCH_API_KEY: ${{ secrets.ZHIPU_SEARCH_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python my-config/scripts/topic_picker.py \
            --trendradar-dir TrendRadar \
            --slot "${{ steps.gate.outputs.slot }}" \
            --social-cache my-config/state/social-validation-cache.json \
            "${args[@]}"

      - name: Record successful delivery
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.dry_run != 'true'
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
          SOURCE: ${{ steps.gate.outputs.source }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python my-config/scripts/delivery_gate.py mark \
            --state my-config/state/delivery-log.json \
            --slot "$SLOT" \
            --source "$SOURCE" \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL"

          cd my-config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/delivery-log.json state/social-validation-cache.json
          git commit -m "Record $SLOT delivery [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Unable to persist the delivery state after 3 attempts."
          exit 1

      - name: Delivery summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AI news delivery"
            echo "- slot: ${{ steps.gate.outputs.slot || 'unresolved' }}"
            echo "- source: ${{ steps.gate.outputs.source || 'unknown' }}"
            echo "- should_run: ${{ steps.gate.outputs.should_run || 'false' }}"
            echo "- gate_reason: ${{ steps.gate.outputs.reason || 'not-run' }}"
            echo "- dry_run: ${{ steps.gate.outputs.dry_run || 'false' }}"
            echo "- job_status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
